[project]
name = "wildfire_detection_mvp_subset_fast"
seed = 42

[paths]
raw_dir = "data/raw"
processed_dir = "data/processed_fast"
artifacts_dir = "artifacts"
events_csv = "data/processed_fast/events.csv"
sequences_csv = "data/processed_fast/sequences_balanced.csv"
tensor_dir = "data/processed_fast/tensors"

[data]
sequence_length = 3
image_size = 128
channels = ["B04", "B03", "B02", "B08"]
full_channels = ["B04", "B03", "B02", "B08", "B11", "B12"]
frame_offsets_days = [-10, -5, 0]
max_cloud_cover = 0.5
train_regions = ["western_us"]
ood_regions = ["canada"]
train_fraction = 0.7
val_fraction = 0.15
test_fraction = 0.15
cluster_radius_km = 5.0
cluster_days = 3
hard_negatives_per_positive = 1
hard_negative_min_distance_km = 7.5
hard_negative_max_distance_km = 25.0
hard_negative_day_jitter = 2

[firms]
source_name = "VIIRS"
min_confidence = ["nominal", "high"]
api_key_env = "FIRMS_API_KEY"
default_region = "western_us"

[sentinel]
provider = "earth_engine"
collection = "COPERNICUS/S2_SR_HARMONIZED"
service_account_json = ""
project = "core-chemist-445906-t5"
service_account_email_env = "GOOGLE_SERVICE_ACCOUNT_EMAIL"
scale_m = 20
search_window_days = 10
min_clear_fraction = 0.3
max_candidates = 10

[training]
batch_size = 16
epochs = 12
learning_rate = 1e-4
weight_decay = 1e-4
dropout = 0.2
early_stopping_patience = 4
positive_class_weight = 1.0

[evaluation]
mc_passes = 30
ece_bins = 15
threshold_min = 0.2
threshold_max = 0.8
threshold_selection = "recall_floor_specificity"
target_recall = 0.85
