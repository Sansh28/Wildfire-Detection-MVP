[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-mvp"
version = "0.1.0"
description = "Fast-track wildfire detection MVP with FIRMS events and Sentinel-2 sequences"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "requests>=2.32",
  "matplotlib>=3.9",
  "scikit-learn>=1.5",
  "torch>=2.3",
  "torchvision>=0.18",
  "pyyaml>=6.0",
  "rasterio>=1.3",
  "geopandas>=1.0",
  "earthengine-api>=0.1.410",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
